<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Registro - Librería Salesiana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro_cliente.css') }}">
</head>
<body>
    <div class="container px-3 px-md-4">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card register-card shadow-lg">
                    <div class="card-header bg-primary text-white text-center py-2 py-md-3">
                        <i class="fas fa-user-plus fa-1x fa-md-2x mb-2"></i>
                        <h4 class="mb-0 fs-5 fs-md-4">Registro de Cliente</h4>
                        <small class="d-block">Crea tu cuenta para comprar online</small>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show small">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}
                        
                        <form method="POST">
                            <div class="row g-2 g-md-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-bold small">Nombres *</label>
                                    <input type="text" name="nombres" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-bold small">Apellidos *</label>
                                    <input type="text" name="apellidos" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row g-2 g-md-3 mt-2 mt-md-3">
                                <div class="col-12 col-md-5">
                                    <label class="form-label fw-bold small">Tipo de Documento</label>
                                    <select name="tipo_documento" id="tipo_documento" class="form-control" onchange="cambiarTipoDocumentoRegistro()">
                                        <option value="DNI">DNI</option>
                                        <option value="CE">Carnet de Extranjería</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-7">
                                    <label class="form-label fw-bold small" id="numeroDocLabel">DNI (opcional)</label>
                                    <input type="text" name="numero_documento" id="numero_documento" class="form-control"
                                           maxlength="8" placeholder="12345678">
                                </div>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Correo Electrónico *</label>
                                <input type="email" name="email" class="form-control" placeholder="cliente@email.com" required>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Teléfono</label>
                                <input type="tel" name="telefono" class="form-control" placeholder="987654321">
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Dirección</label>
                                <textarea name="direccion" class="form-control" rows="2" placeholder="Calle, número, referencia..."></textarea>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Departamento *</label>
                                <select name="departamento" id="departamento" class="form-control" required>
                                    <option value="">Seleccione departamento</option>
                                </select>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Provincia *</label>
                                 <select name="provincia" id="provincia" class="form-control" required>
                                    <option value="">Seleccione provincia</option>
                                </select>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Distrito *</label>
                                <select name="distrito" id="distrito" class="form-control" required>
                                    <option value="">Seleccione distrito</option>
                                </select>
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Contraseña *</label>
                                <input type="password" name="clave" class="form-control" required minlength="6">
                            </div>
                            
                            <div class="mt-2 mt-md-3">
                                <label class="form-label fw-bold small">Confirmar Contraseña *</label>
                                <input type="password" id="confirmar_clave" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3 mt-md-4">
                                <i class="fas fa-check-circle"></i> Registrarme
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center bg-light py-2 py-md-3">
                        <small>¿Ya tienes cuenta? <a href="/login-cliente">Inicia sesión aquí</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/registro_cliente.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
