[uwsgi]
plugins-dir = /usr/alwaysdata/uwsgi/%V/lib/
plugins = cheaper_busyness,router_static,python_3_13

http-socket = [fd00::7:37e2]:8100
thunder-lock

master
lazy-apps
need-app
procname = uWSGI worker [1037421]
procname-master = uWSGI master [1037421]

offload-threads = 1
enable-threads = true
buffer-size = 32768
wsgi-disable-file-wrapper = true

# Logs
logto = /home/librospe/admin/logs/uwsgi/1037421.log
logto2 = /home/librospe/admin/logs/uwsgi/1037421.log
log-reopen = true
disable-logging


processes = 1

# X-Sendfile
pull-header = X-Sendfile X_SENDFILE
response-route-if-not = empty:${X_SENDFILE} fastfile:filename=${X_SENDFILE}

# Set remote address
route-run = setremoteaddr:${HTTP_X_REAL_IP}

# Application
chdir = /home/librospe/www
wsgi-file = /home/librospe/www/passenger_wsgi.py
pyhome = /home/librospe/www/venv
# SECRET_KEY debe vivir en ~/.env, no aqui (esta linea se filtró en git).

# Static files
static-safe = /home/librospe/
static-map = /static/=/home/librospe/www/static
