[pytest]
testpaths = tests
addopts = -ra
markers =
    unitarias: logica pura sin red ni base de datos
    integracion: usa la base de datos real y limpia sus filas
    contrato: valida la forma del JSON que publican los microservicios
    componente: microservicio aislado con test_client (sin gateway)
    e2e: flujo completo contra servicios y gateway vivos
    resiliencia: caidas, timeouts y autollamada del gateway
