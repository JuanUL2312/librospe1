name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: dev
          MARIADB_DATABASE: librospe_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -pdev --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar la base de datos de pruebas
        run: |
          for bd in librospe_ms_inventario librospe_ms_ventas librospe_ms_usuarios librospe_ms_clientes; do
            mysql -h 127.0.0.1 -uroot -pdev -e "CREATE DATABASE IF NOT EXISTS \`$bd\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r Micrososervicios/requirements-dev.txt

      - name: Comprobar la sintaxis de Python
        run: python -m compileall -q Micrososervicios/www Micrososervicios/tests

      - name: Comprobar la sintaxis de JavaScript
        run: |
          for f in Micrososervicios/www/static/js/*.js; do
            node --check "$f"
          done

      - name: Preparar la base de datos de pruebas
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: dev
        run: |
          for i in $(seq 1 20); do
            if mysqladmin ping -h127.0.0.1 -uroot -pdev --silent; then break; fi
            sleep 3
          done
          for bd in librospe_ms_inventario librospe_ms_ventas librospe_ms_usuarios librospe_ms_clientes; do
            mysql -h 127.0.0.1 -uroot -pdev -e "CREATE DATABASE IF NOT EXISTS \`$bd\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done
          python Micrososervicios/tests/preparar_base.py

      - name: Ejecutar las pruebas
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: dev
        run: |
          set +e
          python -m pytest Micrososervicios/tests -q --tb=short 2>&1 | tee /tmp/pytest.log
          codigo=${PIPESTATUS[0]}
          echo "----- resumen de fallos -----"
          grep -E "^(FAILED|ERROR)|^(E ) " /tmp/pytest.log | head -30 | while IFS= read -r l; do
            echo "::error::$l"
          done
          exit $codigo

  contenedor:
    runs-on: ubuntu-latest
    name: Comprobar el docker-compose (gateway + servicios + RabbitMQ)
    steps:
      - uses: actions/checkout@v4
      - name: Validar la configuracion de docker-compose
        run: |
          cp Micrososervicios/.env.example Micrososervicios/.env
          docker compose -f Micrososervicios/docker-compose.yml config --quiet

