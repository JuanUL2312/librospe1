<!-- Datos del Cliente - BOLETA (Persona Natural) -->
<div class="mb-4">
    <div class="alert alert-info">
        <i class="fas fa-info-circle"></i> <strong>Boleta de Venta</strong> - Consumidor Final
    </div>
    
    <label class="form-label fw-bolder fs-5 mb-3">
        <i class="fas fa-user me-3 text-primary"></i>Datos del Cliente
    </label>

    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label fw-semibold">Tipo de Documento</label>
            <select id="tipo_documento_boleta" name="tipo_documento_boleta" class="form-select shadow-sm">
                <option value="DNI">DNI</option>
                <option value="CE">Carnet de Extranjería</option>
                <option value="RUC">RUC (Persona Natural)</option>
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label fw-semibold">Número de Documento</label>
            <input type="text" id="numero_documento_boleta" name="numero_documento_boleta" 
                class="form-control shadow-sm" placeholder="Ingrese DNI (8 dígitos)" maxlength="8">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-semibold">&nbsp;</label>
            <button type="button" id="btnConsultarBoleta" class="btn btn-info w-100">
                <i class="fas fa-search"></i> Consultar
            </button>
        </div>
    </div>

    <!-- Resultado de consulta -->
    <div id="resultadoClienteBoleta" class="mt-3"></div>

    <!-- Datos manuales del cliente -->
    <div class="mt-4 p-3 bg-light rounded">
        <h6><i class="fas fa-edit"></i> Datos del Cliente</h6>
        <div class="row g-3 mt-2">
            <div class="col-md-6">
                <label class="form-label small">Nombres</label>
                <input type="text" name="cliente_nombres_boleta" id="cliente_nombres_boleta"
                    class="form-control" placeholder="Nombres">
            </div>
            <div class="col-md-6">
                <label class="form-label small">Apellidos</label>
                <input type="text" name="cliente_apellidos_boleta" id="cliente_apellidos_boleta"
                    class="form-control" placeholder="Apellidos">
            </div>
            <div class="col-md-12">
                <label class="form-label small">N° Documento</label>
                <input type="text" name="cliente_documento_boleta" id="cliente_documento_boleta"
                    class="form-control" placeholder="Número de documento">
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/boleta_form.js') }}"></script>
